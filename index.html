<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roleta de Desafios</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>🎯 Roleta de Desafios</h1>

        <p>Clique e descubra seu desafio!</p>

        <div class="roleta" id="roleta">
            🎲
        </div>

        <button id="sortear">Girar roleta</button>

        <h2 id="resultado">Seu desafio aparecerá aqui!</h2>

        <p>Desafios sorteados: <span id="contador">0</span></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
